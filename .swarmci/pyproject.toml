[project]
name = "swarmci"
version = "0.1.0"
description = "Shared browser exploration, verified failures, executable CI evidence"
requires-python = ">=3.12"
dependencies = [
    "browser-use>=0.12,<0.13",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "networkx>=3.4",
    "playwright>=1.51",
    "pydantic-settings>=2.8",
    "httpx>=0.28",
    "typer>=0.15",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "respan-ai==4.2.3",
    "respan-instrumentation-openai==1.2.2",
    "openai==2.16.0",
    "ray[default]>=2.54,<3",
]

[project.scripts]
swarmci = "swarmci.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
